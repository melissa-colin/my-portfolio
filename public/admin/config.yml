# Sveltia CMS — content manager for melissacolin.ai (editable from phone at /admin)
# Commits content changes to the source repo; GitHub Actions then rebuilds + deploys.
backend:
  name: github
  repo: melissa-colin/my-portfolio
  branch: main
  base_url: https://melissacolin.ai
  auth_endpoint: oauth

# Bilingual content stored as <slug>.fr.json / <slug>.en.json (matches the Astro collections)
i18n:
  structure: multiple_files
  locales: [fr, en]
  default_locale: fr

media_folder: public/assets/images
public_folder: /assets/images

# Field rule: only "order" and images are shared across languages (i18n: duplicate, edited once
# on the FR tab, greyed on the EN tab). Everything else is fully editable in both FR and EN.
collections:
  - name: projects
    label: Projets
    label_singular: Projet
    folder: src/content/projects
    extension: json
    format: json
    create: true
    identifier_field: title
    summary: '{{title}}'
    i18n: true
    fields:
      - { name: order, label: 'Position (plus le nombre est grand, plus c''est haut)', widget: number, i18n: duplicate, hint: 'Laisse des écarts (10, 20, 30…) pour insérer facilement un nouvel élément.' }
      - { name: title, label: Titre, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: image, label: Image, widget: image, i18n: duplicate }
      - { name: technologies, label: Technologies, widget: list }
      - { name: category, label: Catégorie, widget: string }
      - { name: github, label: Lien GitHub, widget: string, required: false }
      - { name: demo, label: Lien démo, widget: string, required: false }
      - { name: detail, label: "Détail (fenêtre « En savoir plus »)", widget: text, required: false, hint: "Texte long. S'il est rempli, la carte devient cliquable et ouvre une fenêtre." }
      - { name: featured, label: Mis en avant, widget: boolean, default: false, required: false, i18n: duplicate }
      - { name: vibeCoded, label: "Vibe-codé (besoin spécifié par moi, code écrit par une IA)", widget: boolean, default: false, required: false, i18n: duplicate, hint: "Affiche le badge « Vibe-codé » sur la carte et dans la fenêtre du projet." }

  - name: experiences
    label: Expériences
    label_singular: Expérience
    folder: src/content/experiences
    extension: json
    format: json
    create: true
    identifier_field: title
    summary: '{{company}} — {{title}}'
    i18n: true
    fields:
      - { name: order, label: 'Position (plus le nombre est grand, plus c''est haut)', widget: number, i18n: duplicate, hint: 'Laisse des écarts (10, 20, 30…) pour insérer facilement un nouvel élément.' }
      - { name: title, label: Poste, widget: string }
      - { name: company, label: Entreprise, widget: string }
      - { name: companyUrl, label: Site entreprise, widget: string, required: false }
      - { name: location, label: Lieu, widget: string }
      - { name: period, label: Période, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: technologies, label: Technologies, widget: list }
      - { name: type, label: Type, widget: string }
      - { name: award, label: "Distinction (bourse, prix)", widget: string, required: false, hint: "Affiche un badge ambre sur la carte. Laisse vide s'il n'y en a pas." }
      - { name: awardUrl, label: "Lien de la distinction", widget: string, required: false }
      - { name: logo, label: Logo, widget: image, required: false, i18n: duplicate }
      - name: companies
        label: "Employeurs (si plusieurs)"
        widget: list
        required: false
        collapsed: true
        hint: "Laisse vide s'il n'y a qu'un employeur. Le premier de la liste s'affiche devant, logos superposes."
        fields:
          - { name: name, label: Nom, widget: string }
          - { name: url, label: Site, widget: string, required: false }
          - { name: logo, label: Logo, widget: image, required: false, i18n: duplicate }
      - { name: detail, label: Détail (HTML), widget: text, required: false }

